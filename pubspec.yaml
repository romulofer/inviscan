name: inviscan
description: "A new Flutter project."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  provider: ^6.1.5
  path: ^1.9.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.2
  uuid: ^4.5.1
  archive: ^4.0.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

# Ícone do app (fox no crosshair). Regenerar com:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
